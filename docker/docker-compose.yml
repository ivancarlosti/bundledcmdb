name: bundledcmdb

services:
  app:
    image: git.icc.gg/ivancarlos/bundledcmdb:latest
    env_file: .env
    container_name: bundledcmdb
    restart: unless-stopped
    ports:
      - "5600:80"
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_VERSION=${APP_VERSION}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - APP_DEFAULT_LOCALE=${APP_DEFAULT_LOCALE}
      - APP_TIMEZONE=${APP_TIMEZONE}
      # S3/object storage is configured at Settings → Storage (stored in the
      # database, secret encrypted with APP_ENCRYPTION_KEY); no S3 env vars.
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_REDIRECT_URI=${KEYCLOAK_REDIRECT_URI}
    volumes:
      # Attachments for storage.driver=local. Relative to this file, so the
      # default is <checkout>/uploads; set BCMDB_UPLOADS_DIR in .env to move it.
      # Without the mount the files live in the container and die on `down`.
      - ${BCMDB_UPLOADS_DIR:-../uploads}:/var/www/html/var/storage
    extra_hosts:
      - host.docker.internal:host-gateway
