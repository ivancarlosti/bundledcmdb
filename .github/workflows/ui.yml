name: 🧪 SPA

# Quality gate for the React panel (`ui/`). The PHP side keeps its own gates
# (`php -l`, `bin/check-i18n.php`, `bin/test-panel-api.php`), so this workflow
# only needs Node: it never talks to a database, Keycloak or S3 — the Playwright
# suite stubs the panel API (see ui/e2e/fixtures.ts).

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'public/lang/**'
      - 'lib/panel/**'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'public/lang/**'
      - 'lib/panel/**'
      - '.github/workflows/ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui

jobs:
  quality:
    name: 🧱 Typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 📦 Install
        run: npm ci --no-audit --no-fund

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🧹 Lint
        run: npm run lint

      - name: 🧪 Unit tests
        run: npm run test

      - name: 🏗️ Build
        run: npm run build

      # `public/app` is what the Dockerfile and the release ZIP ship, so the
      # bundle is kept as an artifact instead of being rebuilt by whoever needs
      # to inspect it.
      - name: 📤 Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: spa-bundle
          path: public/app
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: 🎭 Playwright
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 📦 Install
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Build
        run: npm run build

      - name: 🌐 Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 🎭 Run suite
        run: npx playwright test

      - name: 📤 Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7
